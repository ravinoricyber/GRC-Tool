openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Compliance OS — GRC tool API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entities
    description: Business entities
  - name: frameworks
    description: Compliance frameworks
  - name: controls
    description: Controls library
  - name: evidence
    description: Evidence requests
  - name: policies
    description: Policy repository
  - name: aocs
    description: Attestations of compliance
  - name: assessments
    description: Assessment engagements
  - name: vendors
    description: Third-party vendors
  - name: activity
    description: Activity log
  - name: dashboard
    description: Dashboard & analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── ENTITIES ───────────────────────────────────────────────────────────────
  /entities:
    get:
      operationId: listEntities
      tags: [entities]
      summary: List all business entities
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"

  /entities/{code}:
    get:
      operationId: getEntity
      tags: [entities]
      summary: Get a single entity
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "404":
          description: Not found

  # ─── FRAMEWORKS ─────────────────────────────────────────────────────────────
  /frameworks:
    get:
      operationId: listFrameworks
      tags: [frameworks]
      summary: List compliance frameworks
      responses:
        "200":
          description: Frameworks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Framework"
    post:
      operationId: createFramework
      tags: [frameworks]
      summary: Create a framework
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameworkInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Framework"

  /frameworks/{id}:
    get:
      operationId: getFramework
      tags: [frameworks]
      summary: Get a framework
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Framework
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Framework"
        "404":
          description: Not found
    patch:
      operationId: updateFramework
      tags: [frameworks]
      summary: Update a framework
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameworkUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Framework"

  # ─── CONTROLS ───────────────────────────────────────────────────────────────
  /controls:
    get:
      operationId: listControls
      tags: [controls]
      summary: List controls
      parameters:
        - name: frameworkId
          in: query
          schema:
            type: ["string", "null"]
        - name: entityCode
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["number", "null"]
        - name: offset
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Controls list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Control"

  /controls/{id}:
    get:
      operationId: getControl
      tags: [controls]
      summary: Get a control
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"
        "404":
          description: Not found
    patch:
      operationId: updateControl
      tags: [controls]
      summary: Update control state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Control"

  # ─── EVIDENCE ───────────────────────────────────────────────────────────────
