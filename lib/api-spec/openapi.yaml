  /dashboard/upcoming-milestones:
    get:
      operationId: getUpcomingMilestones
      tags: [dashboard]
      summary: Upcoming compliance milestones
      parameters:
        - name: entityCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upcoming milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Entity ─────────────────────────────────────────────────────────────
    Entity:
      type: object
      required: [code, name, legalName, merchantLevel, saqType, cdeScope, isActive, createdAt]
      properties:
        code:
          type: string
        name:
          type: string
        legalName:
          type: string
        merchantLevel:
          type: ["string", "null"]
        saqType:
          type: ["string", "null"]
        cdeScope:
          type: ["string", "null"]
        lastAocDate:
          type: ["string", "null"]
        nextAocDate:
          type: ["string", "null"]
        qsaCompany:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    # ─── Framework ──────────────────────────────────────────────────────────
    Framework:
      type: object
      required: [id, code, name, version, priority, status, summary, domainsCount, nextMilestone, createdAt]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        version:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [active, monitored, retired]
        summary:
          type: string
        domainsCount:
          type: number
        nextMilestone:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        createdAt:
          type: string

    FrameworkInput:
      type: object
      required: [code, name, version, priority, status, summary, domainsCount]
      properties:
        code:
          type: string
        name:
          type: string
        version:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [active, monitored, retired]
        summary:
          type: string
        domainsCount:
          type: number
        nextMilestone:
          type: string
        owner:
          type: string

    FrameworkUpdate:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [active, monitored, retired]
        summary:
          type: string
        domainsCount:
          type: number
        nextMilestone:
          type: string
        owner:
          type: string

    # ─── Control ────────────────────────────────────────────────────────────
    Control:
      type: object
      required: [id, frameworkId, frameworkCode, ref, title, domain, domainNumber, createdAt]
      properties:
        id:
          type: string
        frameworkId:
          type: string
        frameworkCode:
          type: string
        ref:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        domain:
          type: string
        domainNumber:
          type: number
        entityCode:
          type: ["string", "null"]
        finding:
          type: ["string", "null"]
          enum: [in-place, not-applicable, not-tested, not-in-place, null]
        notes:
          type: ["string", "null"]
        lastTestedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ControlUpdate:
      type: object
      properties:
        finding:
          type: string
          enum: [in-place, not-applicable, not-tested, not-in-place]
        notes:
          type: string
        entityCode:
          type: string

    # ─── Evidence ───────────────────────────────────────────────────────────
    EvidenceRequest:
      type: object
      required: [id, code, entityCode, controlRef, frameworkCode, title, status, priority, requestedAt, createdAt]
      properties:
        id:
          type: string
        code:
          type: string
        assessmentId:
          type: ["string", "null"]
        controlId:
          type: ["string", "null"]
        controlRef:
          type: string
        controlName:
          type: ["string", "null"]
        frameworkCode:
          type: string
        frameworkName:
          type: ["string", "null"]
        entityCode:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [requested, in-progress, submitted, approved, rejected]
        priority:
          type: string
          enum: [critical, high, medium, low]
        assignee:
          type: ["string", "null"]
        requestedBy:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        requestedAt:
          type: string
        approvedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    EvidenceInput:
      type: object
      required: [entityCode, controlRef, frameworkCode, title, priority]
      properties:
        entityCode:
          type: string
        controlId:
          type: string
        controlRef:
          type: string
        frameworkCode:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        assignee:
          type: string
        requestedBy:
          type: string
        dueDate:
          type: string
        assessmentId:
          type: string

    EvidenceUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [requested, in-progress, submitted, approved, rejected]
        priority:
          type: string
          enum: [critical, high, medium, low]
        assignee:
          type: string
        dueDate:
          type: string
        description:
          type: string
        title:
          type: string

    # ─── Policy ─────────────────────────────────────────────────────────────
    Policy:
      type: object
      required: [id, code, name, owner, version, status, createdAt]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        owner:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [draft, current, review-due, overdue, retired]
        effectiveDate:
          type: ["string", "null"]
        reviewDate:
          type: ["string", "null"]
        pages:
          type: ["number", "null"]
        frameworks:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    PolicyInput:
      type: object
      required: [code, name, owner, version, status]
      properties:
        code:
          type: string
        name:
          type: string
        owner:
          type: string
        version:
          type: string
