    patch:
      operationId: updatePolicy
      tags: [policies]
      summary: Update a policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
    delete:
      operationId: deletePolicy
      tags: [policies]
      summary: Delete a policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── AOCs ───────────────────────────────────────────────────────────────────
  /aocs:
    get:
      operationId: listAocs
      tags: [aocs]
      summary: List AOCs & audit reports
      parameters:
        - name: entityCode
          in: query
          schema:
            type: ["string", "null"]
        - name: frameworkId
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: AOCs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Aoc"
    post:
      operationId: createAoc
      tags: [aocs]
      summary: Upload an AOC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AocInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
