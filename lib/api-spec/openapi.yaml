                  $ref: "#/components/schemas/ActivityEntry"

  # ─── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats for an entity
      parameters:
        - name: entityCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/evidence-by-status:
    get:
      operationId: getEvidenceByStatus
      tags: [dashboard]
      summary: Evidence requests grouped by status
      parameters:
        - name: entityCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence by status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/control-coverage:
    get:
      operationId: getControlCoverage
      tags: [dashboard]
      summary: Control coverage by PCI DSS requirement
      parameters:
        - name: entityCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Control coverage breakdown
          content:
            application/json:
              schema:
                type: array
